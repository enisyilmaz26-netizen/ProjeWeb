# MEB ÖGEDEP — production security headers
# /etc/nginx/conf.d/meb-security-headers.conf
# nginx default config'i conf.d/*.conf'u http {} bloğuna include eder,
# o yüzden burada tanımlanan add_header'lar tüm server bloklarına uygulanır.
# always parametresi, error sayfaları dahil her response'a header'ı ekler.

add_header X-Frame-Options "DENY" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' data: https://nspircxgtrhdcxtnvodz.supabase.co; font-src 'self' https://fonts.gstatic.com; connect-src 'self' https://nspircxgtrhdcxtnvodz.supabase.co wss://nspircxgtrhdcxtnvodz.supabase.co https://api.brevo.com https://*.sentry.io; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

# index.html için ayrı no-cache (SPA shell): cache yenilemesi anında alınsın.
# Bu map directive olmadan map kullanılamayacağı için sadece global add_header.
# Server bloğunda override edilebilir; default behavior:
# Cache asset'ler hash'li (vercel.json'da olduğu gibi 1 yıl immutable) — bu da
# nginx server bloğunda /assets/ için ayrı location yazılarak yapılabilir:
#
#   location = /index.html {
#     add_header Cache-Control "no-store, no-cache, must-revalidate" always;
#   }
#   location /assets/ {
#     add_header Cache-Control "public, max-age=31536000, immutable" always;
#   }
