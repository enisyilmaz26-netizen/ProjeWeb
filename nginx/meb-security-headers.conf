# MEB ÖGEDEP — production security headers
# /etc/nginx/conf.d/meb-security-headers.conf
# nginx default config'i conf.d/*.conf'u http {} bloğuna include eder,
# o yüzden burada tanımlanan add_header'lar tüm server bloklarına uygulanır.
# always parametresi, error sayfaları dahil her response'a header'ı ekler.

add_header X-Frame-Options "DENY" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' data: https://nspircxgtrhdcxtnvodz.supabase.co; font-src 'self' https://fonts.gstatic.com; connect-src 'self' https://nspircxgtrhdcxtnvodz.supabase.co wss://nspircxgtrhdcxtnvodz.supabase.co https://api.brevo.com; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
